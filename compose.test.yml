name: yiai-platform-test

services:
  db:
    image: postgres:16-alpine
    container_name: yiai-platform-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${YIAI_PLATFORM_DB_USER:?YIAI_PLATFORM_DB_USER is required}
      POSTGRES_PASSWORD: ${YIAI_PLATFORM_DB_PASSWORD:?YIAI_PLATFORM_DB_PASSWORD is required}
      POSTGRES_DB: ${YIAI_PLATFORM_DB_NAME:?YIAI_PLATFORM_DB_NAME is required}
    volumes:
      - ${YIAI_PLATFORM_TEST_DATA_ROOT:-/volume3/docker/volumes/yiai-platform-test}:/var/lib/postgresql/data
    networks:
      - yiai-platform-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${YIAI_PLATFORM_DB_USER} -d ${YIAI_PLATFORM_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    container_name: yiai-platform-test-migrate
    restart: "no"
    environment:
      NODE_ENV: test
      YIAI_PLATFORM_DB_HOST: db
      YIAI_PLATFORM_DB_PORT: 5432
      YIAI_PLATFORM_DB_USER: ${YIAI_PLATFORM_DB_USER:?YIAI_PLATFORM_DB_USER is required}
      YIAI_PLATFORM_DB_PASSWORD: ${YIAI_PLATFORM_DB_PASSWORD:?YIAI_PLATFORM_DB_PASSWORD is required}
      YIAI_PLATFORM_DB_NAME: ${YIAI_PLATFORM_DB_NAME:?YIAI_PLATFORM_DB_NAME is required}
    command: ["node", "db/migrations/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yiai-platform-test-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    container_name: yiai-platform-test-api
    restart: unless-stopped
    environment:
      NODE_ENV: test
      YIAI_PLATFORM_API_PORT: 3000
      YIAI_PLATFORM_DB_HOST: db
      YIAI_PLATFORM_DB_PORT: 5432
      YIAI_PLATFORM_DB_USER: ${YIAI_PLATFORM_DB_USER:?YIAI_PLATFORM_DB_USER is required}
      YIAI_PLATFORM_DB_PASSWORD: ${YIAI_PLATFORM_DB_PASSWORD:?YIAI_PLATFORM_DB_PASSWORD is required}
      YIAI_PLATFORM_DB_NAME: ${YIAI_PLATFORM_DB_NAME:?YIAI_PLATFORM_DB_NAME is required}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - yiai-platform-test-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
    container_name: yiai-platform-test-web
    restart: unless-stopped
    ports:
      - "18111:80"
    depends_on:
      - api
    networks:
      - yiai-platform-test-net

networks:
  yiai-platform-test-net:
    name: yiai-platform-test-net
