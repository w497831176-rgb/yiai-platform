name: yiai-platform-test

services:
  db:
    image: postgres:16-alpine
    container_name: yiai-platform-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${YIAI_PLATFORM_DB_USER}
      POSTGRES_PASSWORD: ${YIAI_PLATFORM_DB_PASSWORD}
      POSTGRES_DB: ${YIAI_PLATFORM_DB_NAME}
    volumes:
      - /volume3/docker/volumes/yiai-platform-test:/var/lib/postgresql/data
    networks:
      - yiai-platform-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${YIAI_PLATFORM_DB_USER} -d ${YIAI_PLATFORM_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yiai-platform-test-api
    restart: unless-stopped
    environment:
      NODE_ENV: test
      YIAI_PLATFORM_API_PORT: 3000
      YIAI_PLATFORM_DB_HOST: db
      YIAI_PLATFORM_DB_PORT: 5432
      YIAI_PLATFORM_DB_USER: ${YIAI_PLATFORM_DB_USER}
      YIAI_PLATFORM_DB_PASSWORD: ${YIAI_PLATFORM_DB_PASSWORD}
      YIAI_PLATFORM_DB_NAME: ${YIAI_PLATFORM_DB_NAME}
      YIAI_PLATFORM_JWT_SECRET: ${YIAI_PLATFORM_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yiai-platform-test-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: yiai-platform-test-web
    restart: unless-stopped
    ports:
      - "18111:80"
    depends_on:
      - api
    networks:
      - yiai-platform-test-net

networks:
  yiai-platform-test-net:
    name: yiai-platform-test-net
