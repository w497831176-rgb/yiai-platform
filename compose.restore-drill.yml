name: yiai-platform-restore-drill

services:
  db:
    image: postgres:16-alpine
    container_name: yiai-platform-restore-drill-db
    environment:
      POSTGRES_USER: ${YIAI_PLATFORM_DB_USER:?YIAI_PLATFORM_DB_USER is required}
      POSTGRES_PASSWORD: ${YIAI_PLATFORM_DB_PASSWORD:?YIAI_PLATFORM_DB_PASSWORD is required}
      POSTGRES_DB: ${YIAI_PLATFORM_DB_NAME:?YIAI_PLATFORM_DB_NAME is required}
    volumes:
      - ${YIAI_PLATFORM_DRILL_DATA_ROOT:?YIAI_PLATFORM_DRILL_DATA_ROOT is required}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - yiai-platform-restore-drill-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${YIAI_PLATFORM_DB_USER} -d ${YIAI_PLATFORM_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    container_name: yiai-platform-restore-drill-migrate
    restart: "no"
    environment:
      NODE_ENV: production
      YIAI_PLATFORM_DB_HOST: db
      YIAI_PLATFORM_DB_PORT: 5432
      YIAI_PLATFORM_DB_USER: ${YIAI_PLATFORM_DB_USER:?YIAI_PLATFORM_DB_USER is required}
      YIAI_PLATFORM_DB_PASSWORD: ${YIAI_PLATFORM_DB_PASSWORD:?YIAI_PLATFORM_DB_PASSWORD is required}
      YIAI_PLATFORM_DB_NAME: ${YIAI_PLATFORM_DB_NAME:?YIAI_PLATFORM_DB_NAME is required}
      YIAI_PLATFORM_JWT_SECRET: ${YIAI_PLATFORM_JWT_SECRET:?YIAI_PLATFORM_JWT_SECRET is required}
    command: ["node", "db/migrations/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yiai-platform-restore-drill-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    container_name: yiai-platform-restore-drill-api
    environment:
      NODE_ENV: production
      YIAI_PLATFORM_API_PORT: 13000
      YIAI_PLATFORM_API_HOST: 127.0.0.1
      YIAI_PLATFORM_DB_HOST: 127.0.0.1
      YIAI_PLATFORM_DB_PORT: 15432
      YIAI_PLATFORM_DB_USER: ${YIAI_PLATFORM_DB_USER:?YIAI_PLATFORM_DB_USER is required}
      YIAI_PLATFORM_DB_PASSWORD: ${YIAI_PLATFORM_DB_PASSWORD:?YIAI_PLATFORM_DB_PASSWORD is required}
      YIAI_PLATFORM_DB_NAME: ${YIAI_PLATFORM_DB_NAME:?YIAI_PLATFORM_DB_NAME is required}
      YIAI_PLATFORM_JWT_SECRET: ${YIAI_PLATFORM_JWT_SECRET:?YIAI_PLATFORM_JWT_SECRET is required}
    volumes:
      - ${YIAI_PLATFORM_DRILL_DATA_ROOT:?YIAI_PLATFORM_DRILL_DATA_ROOT is required}/icon-cache:/app/data/icon-cache
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:13000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
      args:
        NGINX_CONFIG: infra/nginx/nginx.restore-drill.conf
    container_name: yiai-platform-restore-drill-web
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18115/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

networks:
  yiai-platform-restore-drill-net:
    name: yiai-platform-restore-drill-net
